[package]
name = "flexplore-net"
version = "0.1.0"
edition = "2024"
description = "Host-relay sequencing and the matchbox socket for networked flexplore"

[dependencies]
bevy = { version = "0.20", default-features = false, features = ["bevy_log"] }
# From the fork's main, which carries Bevy 0.20 support and the socket
# hardening: the crates.io release does not yet support Bevy 0.20.
bevy_matchbox = { git = "https://github.com/barafael/matchbox.git", branch = "main" }
flexplore-proto = { path = "../flexplore-proto" }
flexplore-core = { path = "../flexplore-core" }
rand = "0.10"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }
web-sys = { version = "0.3", features = ["Window", "Location", "History"] }
wasm-bindgen = "0.2"

[package.metadata.cargo-shear]
ignored = ["getrandom"]
