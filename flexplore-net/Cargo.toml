[package]
name = "flexplore-net"
version = "0.1.0"
edition = "2024"
description = "P2P WebRTC networking for flexplore: host-sequenced layout edits over matchbox"

[dependencies]
bevy = "0.18"
flexplore-proto = { path = "../flexplore-proto" }
matchbox_socket = { git = "https://github.com/barafael/matchbox.git" }
rand = "0.8"
uuid = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
web-sys = { version = "0.3", features = ["Window", "Location", "Url", "UrlSearchParams", "History"] }
wasm-bindgen = "0.2"
