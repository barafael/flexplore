[package]
name = "flexplore"
version = "1.0.0"
edition = "2024"

[features]
default = ["multiplayer"]
multiplayer = [
    "dep:flexplore-net",
]

[dependencies]
flexplore-core = { path = "../flexplore-core", features = ["bevy"] }
flexplore-net = { path = "../flexplore-net", optional = true }
bevy = { version = "0.19", features = ["serialize"] }
bevy_egui = "0.42"
rand = "0.10"
strum = { version = "0.28.0", features = ["derive"] }
anyhow = "1.0.102"
catppuccin = { version = "2", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25.10", default-features = false, features = ["png"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
dirs = "7"
rfd = "0.17"

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = ["Window", "Storage", "Blob", "BlobPropertyBag", "Url", "HtmlAnchorElement", "Document", "Location"] }
wasm-bindgen = "0.2"
js-sys = "0.3"
# rand needs a JS-backed entropy source on wasm32-unknown-unknown.
getrandom = { version = "0.4", features = ["wasm_js"] }

# The live multiplayer integration test (`tests/multiplayer.rs`) hosts an
# in-process full-mesh signaling server to introduce the real peers. The fork
# of matchbox this repo builds re-versions `matchbox_signaling` to 0.15.0
# without changing a line of signaling or protocol source, so the published
# 0.14.0 crate talks the same wire protocol. Test-only: the app never runs a
# signaling server.
[dev-dependencies]
matchbox_signaling = "0.14"
tokio = { version = "1", features = ["rt-multi-thread"] }
